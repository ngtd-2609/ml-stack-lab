services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ml-stack-lab:dev
    gpus: all
    working_dir: /app
    command:
      - uvicorn
      - ml_stack_lab.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
    external: true
    name: ml-stack-lab-grafana-data
